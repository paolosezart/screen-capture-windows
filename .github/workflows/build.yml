name: Build ScreenShotCli (Go)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - dev
      - go-rewrite
      - windows-automation-features
      - active-window-capture
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Show build environment
        shell: pwsh
        run: |
          go version
          go env GOOS GOARCH
          Write-Host "Commit: ${{ github.sha }}"

      - name: Run Go unit tests
        shell: pwsh
        run: go test ./... -v

      - name: Build standalone Windows x64 executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\publish | Out-Null
          go build -trimpath -ldflags="-s -w" -o .\publish\ScreenShotCli.exe . *> build.log
          $buildExitCode = $LASTEXITCODE
          if (Test-Path .\build.log) { Get-Content .\build.log }
          if ($buildExitCode -ne 0) { exit $buildExitCode }
          $exe = Get-Item .\publish\ScreenShotCli.exe
          Write-Host ("EXE size: {0:N0} bytes ({1:N2} MiB)" -f $exe.Length, ($exe.Length / 1MB))

      - name: Package EXE and create checksum
        shell: pwsh
        run: |
          Compress-Archive -Path .\publish\ScreenShotCli.exe -DestinationPath .\publish\ScreenShotCli-win-x64.zip -Force
          $hash = (Get-FileHash .\publish\ScreenShotCli-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ScreenShotCli-win-x64.zip" | Set-Content .\publish\SHA256SUMS.txt -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenShotCli-win-x64
          path: |
            publish/ScreenShotCli-win-x64.zip
            publish/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest continuous build
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/windows-automation-features'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          target_commitish: ${{ github.sha }}
          name: Latest continuous build
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            publish/ScreenShotCli-win-x64.zip
            publish/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            publish/ScreenShotCli-win-x64.zip
            publish/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
