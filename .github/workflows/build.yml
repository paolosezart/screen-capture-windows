name: Build ScreenShotCli

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - dev
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show build environment
        shell: pwsh
        run: |
          dotnet --info
          Write-Host "Commit: ${{ github.sha }}"

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore .\ScreenShotCli.csproj

      - name: Publish self-contained Windows x64 EXE
        shell: pwsh
        run: dotnet publish .\ScreenShotCli.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output .\publish\win-x64

      - name: Package EXE and create checksum
        shell: pwsh
        run: |
          Compress-Archive -Path .\publish\win-x64\ScreenShotCli.exe -DestinationPath .\publish\ScreenShotCli-win-x64.zip -Force
          $hash = (Get-FileHash .\publish\ScreenShotCli-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ScreenShotCli-win-x64.zip" | Set-Content .\publish\SHA256SUMS.txt -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenShotCli-win-x64
          path: |
            publish/ScreenShotCli-win-x64.zip
            publish/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: |
            restore.log
            build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish stable GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            publish/ScreenShotCli-win-x64.zip
            publish/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
